[project]
name = "job-search-auth-service"
version = "0.1.0"
description = "Authentication & Authorization Service for Job Search Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "structlog>=24.4.0",
    "joserfc>=1.0.0",
    "pwdlib[argon2]>=0.2.0",
    "httpx>=0.28.0",
    "job-search-shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
job-search-shared = { workspace = true }

[project]
name = "job-search-agent-service"
version = "0.1.0"
description = "AI Agent Service for Job Discovery, Resume Tailoring, Prep & GitHub Matching"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "google-genai>=1.0.0",
    "feedparser>=6.0.11",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "structlog>=24.4.0",
    "httpx>=0.28.0",
    "pygithub>=2.5.0",
    "beautifulsoup4>=4.12.3",
    "pypdf>=5.0.0",
    "python-multipart>=0.0.18",
    "python-jobspy>=1.1.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.5",
    "apscheduler>=3.11.0,<4.0.0",
    "job-search-shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
job-search-shared = { workspace = true }
